<ol class="tl notranslate">
{% for a in include.items %}  <li class="tl-item">
    <span class="tl-date">{{ a.date }}</span>
    <div class="tl-body"><span class="role role-{{ a.kind }}">{{ a.role }}</span>{% if a.title %}<span class="tl-title">“{{ a.title }}”</span>{% endif %}
      <span class="tl-event">{% if a.url %}<a href="{{ a.url }}" target="_blank" rel="noopener">{{ a.event }}</a>{% else %}{{ a.event }}{% endif %}</span>{% if a.photo %}{% assign big = a.photo_full | default: a.photo %}<a class="tl-photo" href="{{ big | relative_url }}" target="_blank"><img src="{{ a.photo | relative_url }}" alt="Photo: {{ a.role }}, {{ a.date }}" loading="lazy"></a>{% endif %}</div>
  </li>
{% endfor %}</ol>
